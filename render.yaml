services:
  - type: web
    name: baja-rulebot-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: DATABASE_URL
        sync: false
